<!DOCTYPE html>
<html lang="en" class="preload">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | SecureX Security Solutions</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <meta name="description" content="Create your SecureX account to manage security systems, monitoring and get 24/7 support.">
  <script>
    (function(){
      try {
        var theme = localStorage.getItem('securex_theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') document.documentElement.classList.add('dark');
      } catch(e) {}
        try {
          var securexPrefs = JSON.parse(localStorage.getItem('securex_preferences') || '{}');
          document.documentElement.setAttribute('dir', securexPrefs.rtl === 'rtl' ? 'rtl' : 'ltr');
        } catch (e) {}
      document.documentElement.classList.remove('preload');
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Segoe UI', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=3">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 font-sans antialiased transition-colors duration-300 overflow-x-hidden" data-nav="minimal-brandless">

  <!-- Signup Section -->
  <section class="py-16 sm:py-20 bg-slate-50 dark:bg-slate-800/50 min-h-[calc(100vh-5rem)] flex items-center">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
      <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-xl overflow-hidden scroll-reveal grid grid-cols-1 lg:grid-cols-2">
        <!-- Side Image -->
        <div class="relative h-44 sm:h-56 lg:h-auto overflow-hidden">
          <img src="assets/images/home2 hero bg.jpg" alt="SecureX security" class="absolute inset-0 w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-blue-950 via-blue-900/70 to-transparent lg:bg-gradient-to-r"></div>
          <div class="absolute inset-0 flex lg:flex-col items-end lg:items-start justify-end lg:justify-center p-6 sm:p-8">
            <div class="lg:max-w-xs">
              <span class="inline-flex items-center space-x-2 bg-white/10 backdrop-blur px-3 py-1.5 rounded-full text-xs text-white font-semibold mb-3">
                <i data-lucide="shield" class="w-3.5 h-3.5"></i>
                <span>JOIN SECUREX</span>
              </span>
              <h3 class="text-xl sm:text-2xl font-extrabold text-white mb-2">Get Full-Featured Smart Security</h3>
              <p class="text-sm text-blue-100 leading-relaxed hidden lg:block">One account for your cameras, alarms and locks — with live alerts, remote control and priority 24/7 support.</p>
            </div>
          </div>
        </div>

        <!-- Form Side -->
        <div class="p-6 sm:p-8">
          <!-- Logo & Brand -->
          <div class="flex items-center space-x-3 mb-6">
            <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-600/20">
              <i data-lucide="shield-check" class="w-6 h-6 text-white"></i>
            </div>
            <a href="index.html" class="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">Secure<span class="text-blue-600">X</span></a>
          </div>
          <div class="mb-6">
            <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white mb-2">Create an Account</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400">Sign up in under a minute — it's free</p>
          </div>

        <form id="signup-form" class="space-y-5" novalidate>
          <div>
            <label for="signup-name" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Full Name *</label>
            <div class="relative">
              <i data-lucide="user" class="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              <input type="text" id="signup-name" placeholder="John Smith" autocomplete="name" class="w-full pl-11 pr-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
            </div>
            <p id="signup-name-error" class="form-error hidden text-red-500 text-xs mt-1"></p>
          </div>

          <div>
            <label for="signup-email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email Address *</label>
            <div class="relative">
              <i data-lucide="mail" class="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              <input type="email" id="signup-email" placeholder="john@example.com" autocomplete="email" class="w-full pl-11 pr-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
            </div>
            <p id="signup-email-error" class="form-error hidden text-red-500 text-xs mt-1"></p>
          </div>

          <div>
            <label for="signup-password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Password *</label>
            <div class="relative">
              <i data-lucide="lock" class="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              <input type="password" id="signup-password" placeholder="Minimum 8 characters" autocomplete="new-password" class="w-full pl-11 pr-11 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
              <button type="button" data-toggle-password tabindex="-1" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors" aria-label="Show password">
                <i data-lucide="eye" class="w-5 h-5 pointer-events-none"></i>
              </button>
            </div>
            <p id="signup-password-error" class="form-error hidden text-red-500 text-xs mt-1"></p>
          </div>

          <div>
            <label for="signup-confirm" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Confirm Password *</label>
            <div class="relative">
              <i data-lucide="lock" class="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              <input type="password" id="signup-confirm" placeholder="Re-enter your password" autocomplete="new-password" class="w-full pl-11 pr-11 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
              <button type="button" data-toggle-password tabindex="-1" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors" aria-label="Show password">
                <i data-lucide="eye" class="w-5 h-5 pointer-events-none"></i>
              </button>
            </div>
            <p id="signup-confirm-error" class="form-error hidden text-red-500 text-xs mt-1"></p>
          </div>

          <label class="flex items-start space-x-2.5 cursor-pointer">
            <input type="checkbox" id="signup-terms" class="w-4 h-4 mt-0.5 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
            <span class="text-sm text-slate-600 dark:text-slate-300">I agree to the <a href="#" class="font-medium text-blue-600 dark:text-blue-400 hover:underline">Terms of Service</a> and <a href="#" class="font-medium text-blue-600 dark:text-blue-400 hover:underline">Privacy Policy</a>.</span>
          </label>
          <p id="signup-terms-error" class="form-error hidden text-red-500 text-xs mt-1"></p>

          <button type="submit" class="w-full flex items-center justify-center space-x-2 px-6 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-colors shadow-lg shadow-blue-600/25 hover:shadow-blue-600/40">
            <i data-lucide="user-plus" class="w-5 h-5"></i>
            <span>Create Account</span>
          </button>
        </form>

        <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
          Already have an account? <a href="login.html" class="font-semibold text-blue-600 dark:text-blue-400 hover:underline">Sign in</a>
        </p>
        </div>
      </div>
    </div>
  </section>

  <script>
    (function () {
      document.querySelectorAll('[data-toggle-password]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var input = btn.closest('div').querySelector('input[type="password"], input[type="text"]');
          if (!input) return;
          var show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          btn.querySelector('i').setAttribute('data-lucide', show ? 'eye-off' : 'eye');
          if (typeof lucide !== 'undefined') lucide.createIcons({ nodes: [btn] });
        });
      });

      var form = document.getElementById('signup-form');
      function setError(id, msg) {
        var err = document.getElementById(id + '-error');
        if (err) {
          if (msg) { err.textContent = msg; err.classList.remove('hidden'); }
          else err.classList.add('hidden');
        }
      }
      function showError(id, message) { setError(id, message); }
      function clearError(id) { setError(id, ''); }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = document.getElementById('signup-name');
        var email = document.getElementById('signup-email');
        var password = document.getElementById('signup-password');
        var confirm = document.getElementById('signup-confirm');
        var terms = document.getElementById('signup-terms');
        var ok = true;

        if (!name.value.trim()) { showError('signup-name', 'Full name is required.'); ok = false; }
        else clearError('signup-name');

        if (!email.value.trim()) { showError('signup-email', 'Email address is required.'); ok = false; }
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) { showError('signup-email', 'Enter a valid email address.'); ok = false; }
        else clearError('signup-email');

        if (!password.value) { showError('signup-password', 'Password is required.'); ok = false; }
        else if (password.value.length < 8) { showError('signup-password', 'Password must be at least 8 characters.'); ok = false; }
        else clearError('signup-password');

        if (!confirm.value) { showError('signup-confirm', 'Please confirm your password.'); ok = false; }
        else if (password.value !== confirm.value) { showError('signup-confirm', 'Passwords do not match.'); ok = false; }
        else clearError('signup-confirm');

        if (!terms.checked) { showError('signup-terms', 'You must accept the Terms of Service.'); ok = false; }
        else clearError('signup-terms');

        if (ok && typeof showToast === 'function') {
          showToast('Account created! Sign up is a demo feature – thanks for exploring SecureX.', 'success');
          form.reset();
        }
      });

      ['signup-name', 'signup-email', 'signup-password', 'signup-confirm'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('input', function () { clearError(id); });
      });

      document.getElementById('signup-terms').addEventListener('change', function () { clearError('signup-terms'); });
    })();
  </script>

  <script src="js/main.js?v=5"></script>
  <script src="js/nav.js?v=9"></script>
</body>
</html>
