<!DOCTYPE html>
<html lang="en" class="preload">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | SecureX</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <script>
    (function(){
      try {
        var theme = localStorage.getItem('securex_theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') document.documentElement.classList.add('dark');
      } catch(e) {}
        try {
          var securexPrefs = JSON.parse(localStorage.getItem('securex_preferences') || '{}');
          document.documentElement.setAttribute('dir', securexPrefs.rtl === 'rtl' ? 'rtl' : 'ltr');
        } catch (e) {}
      document.documentElement.classList.remove('preload');
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Segoe UI', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=3">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 font-sans antialiased transition-colors duration-300 overflow-x-hidden">

  <!-- 404 Content -->
  <section class="min-h-screen flex items-center justify-center bg-white dark:bg-slate-900">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 text-center fade-in-up">
      <div class="relative inline-flex mb-8">
        <div class="absolute inset-0 bg-blue-500/20 blur-3xl rounded-full"></div>
        <div class="relative w-28 h-28 bg-navy-900 dark:bg-slate-800 border border-blue-500/30 rounded-3xl flex items-center justify-center shield-pulse">
          <i data-lucide="shield-x" class="w-14 h-14 text-blue-400"></i>
        </div>
        <div class="absolute -top-3 -right-3 bg-blue-600 rounded-xl px-3 py-1.5 shadow-lg">
          <span class="text-white text-xs font-bold">404</span>
        </div>
      </div>

      <h1 class="text-5xl sm:text-6xl font-extrabold text-slate-900 dark:text-white mb-4 gradient-text">Page Not Found</h1>
      <p class="text-lg text-slate-600 dark:text-slate-300 mb-8 leading-relaxed">
        The page you're looking for doesn't exist or has been moved.<br class="hidden sm:block">
        Let's get you back to safety.
      </p>

      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <a href="index.html" class="inline-flex items-center justify-center space-x-2 px-6 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-all duration-200 shadow-lg shadow-blue-600/25">
          <i data-lucide="home" class="w-5 h-5"></i>
          <span>Back to Home</span>
        </a>
        <a href="contact.html" class="inline-flex items-center justify-center space-x-2 px-6 py-3.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold rounded-xl transition-colors">
          <i data-lucide="phone" class="w-5 h-5"></i>
          <span>Contact Support</span>
        </a>
      </div>

      <div class="mt-12 pt-8 border-t border-slate-200 dark:border-slate-700">
        <p class="text-sm text-slate-500 dark:text-slate-400">Popular Pages</p>
        <div class="flex flex-wrap justify-center gap-3 mt-4">
          <a href="products.html" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 text-sm text-slate-600 dark:text-slate-300 rounded-lg hover:bg-blue-50 dark:hover:bg-blue-900/30 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Products</a>
          <a href="packages.html" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 text-sm text-slate-600 dark:text-slate-300 rounded-lg hover:bg-blue-50 dark:hover:bg-blue-900/30 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Packages</a>
          <a href="installation.html" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 text-sm text-slate-600 dark:text-slate-300 rounded-lg hover:bg-blue-50 dark:hover:bg-blue-900/30 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Installation</a>
        </div>
      </div>
    </div>
  </section>

  <script src="js/main.js?v=5"></script>
</body>
</html>
